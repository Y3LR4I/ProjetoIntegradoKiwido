<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notícias | Projeto Mangue Vivo</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/conteudos.css">
</head>

<body>

    <!-- Header -->
    <div id="header-container"></div>

    <!-- Banner de Notícias -->
    <section class="banner-noticias">

        <img src="../assets/images/hero/img_heroSection2_01.png" alt="Imagem de destaque do Projeto Mangue Vivo"
            class="banner-noticias-imagem">

        <div class="banner-noticias-conteudo">
            <h1>Notícias do Mangue Vivo</h1>

            <p>
                Acompanhe as notícias, ações e novidades do Mangue Vivo, além de novidades sobre as
                nossas atividades e muito mais.
            </p>
        </div>

    </section>

    <!-- Barra de filtros e busca -->
    <section class="noticias-filtros">

        <div class="noticias-categorias">
            <button class="categoria-btn ativo" type="button">
                Todas
            </button>

            <button class="categoria-btn" type="button">
                Projetos
            </button>

            <button class="categoria-btn" type="button">
                Eventos
            </button>

            <button class="categoria-btn" type="button">
                Comunidade
            </button>
        </div>

        <div class="noticias-busca">
            <input type="search" placeholder="Buscar notícias..." aria-label="Buscar notícias">
        </div>

    </section>

    <script src="../js/components.js"></script>
    <script src="../js/script.js"></script>
</body>

</html>
