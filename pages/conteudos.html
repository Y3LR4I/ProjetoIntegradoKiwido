<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notícias | Projeto Mangue Vivo</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/conteudos.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
</head>

<body>

    <!-- Header -->
    <div id="header-container"></div>


    <!-- Banner de Notícias -->
    <section class="banner-noticias">

        <img src="../assets/images/hero/img_heroSection2_01.png" alt="Imagem de destaque do Projeto Mangue Vivo"
            class="banner-noticias-imagem">

        <div class="banner-noticias-conteudo">
            <h1>Notícias do Mangue Vivo</h1>

            <p>
                Acompanhe as notícias, ações e novidades do Mangue Vivo, além de novidades sobre as
                nossas atividades e muito mais.
            </p>
        </div>

        <div class="divisor-onda" aria-hidden="true">
            <svg viewBox="0 0 1440 120" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M0,45
                    C180,140 280,-30 460,50
                    C650,150 760,-35 920,55
                    C1100,145 1280,-25 1440,45
                    L1440,120 L0,120 Z" fill="var(--cor-fundo)" />
            </svg>
        </div>

    </section>

    <!-- FILTROS E BUSCA -->
    <section class="container noticias-filtros">

        <div class="noticias-categorias">
            <button class="categoria-btn ativo" type="button" data-categoria="Todas">
                Todas
            </button>

            <button class="categoria-btn" type="button" data-categoria="Projetos">
                Projetos
            </button>

            <button class="categoria-btn" type="button" data-categoria="Eventos">
                Eventos
            </button>

            <button class="categoria-btn" type="button" data-categoria="Comunidade">
                Comunidade
            </button>
        </div>

        <div class="noticias-busca">
            <span class="material-symbols-outlined icone-busca" aria-hidden="true">
                search
            </span>

            <input type="search" id="busca-noticias" placeholder="Buscar notícias..." aria-label="Buscar notícias">
        </div>

    </section>


    <!-- LISTA DE NOTÍCIAS -->
    <section class="container noticias-container">

        <div class="row g-4" id="lista-noticias">
            <!-- Os cards serão gerados pelo JavaScript -->
        </div>

        <!-- Mensagem quando não houver resultados -->
        <p id="mensagem-vazia" class="text-center mt-4" hidden>
            Nenhuma notícia encontrada.
        </p>

        <!-- PAGINAÇÃO -->
        <nav class="mt-5" aria-label="Paginação das notícias" id="navegacao-noticias">
            <ul class="pagination justify-content-center flex-wrap" id="paginacao-noticias">
            </ul>
        </nav>

    </section>

    <!-- Ondas de transição para o footer -->
    <div class="footer-ondas" aria-hidden="true">
        <svg class="footer-ondas-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 120"
            preserveAspectRatio="none">
            <path d="M0,64 C180,120 360,20 540,55
               C720,90 900,120 1080,55
               C1260,0 1350,30 1440,48
               L1440,120 L0,120 Z" fill="#163812" />
        </svg>
    </div>

    <div id="footer-container"></div>

    <div id="footer-container"></div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Componentes do projeto -->
    <script src="../js/components.js"></script>

    <!-- JavaScript geral do projeto -->
    <script src="../js/script.js"></script>

    <!-- JavaScript da página de notícias -->
    <script src="../js/conteudos.js"></script>
</body>

</html>
