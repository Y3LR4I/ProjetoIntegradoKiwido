<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Notícia | Mangue Vivo</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/noticia.css">
</head>

<body>

    <!-- HEADER COMPARTILHADO -->
    <div id="header-container"></div>

    <main class="pagina-noticia">

        <!-- CABEÇALHO DA NOTÍCIA -->
        <section class="noticia-cabecalho">

            <div class="noticia-cabecalho-container">

                <a href="conteudos.html" class="noticia-voltar">
                    ← Voltar para notícias
                </a>

                <div id="conteudo-noticia">

                    <p class="noticia-carregando">
                        Carregando notícia...
                    </p>

                </div>

            </div>

            <!-- ONDA INFERIOR -->
            <div class="noticia-onda" aria-hidden="true">
                <svg
                    viewBox="0 0 1440 120"
                    preserveAspectRatio="none"
                    xmlns="http://www.w3.org/2000/svg"
                >
                    <path
                        d="M0,45
                           C180,140 280,-30 460,50
                           C650,150 760,-35 920,55
                           C1100,145 1280,-25 1440,45
                           L1440,120 L0,120 Z"
                    />
                </svg>
            </div>

        </section>

        <!-- CORPO DA NOTÍCIA -->
        <section class="noticia-corpo-container">

            <article
                id="corpo-noticia"
                class="noticia-corpo"
            >
                <!-- Parágrafos e subtítulos inseridos pelo JavaScript -->
            </article>

            <!-- COMPARTILHAR -->
            <div class="noticia-compartilhar-container">
                <button
                    type="button"
                    id="botao-compartilhar"
                    class="noticia-botao-compartilhar"
                >
                    <span aria-hidden="true">
                        <svg
                            viewBox="0 0 24 24"
                            width="20"
                            height="20"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <circle cx="18" cy="5" r="3"></circle>
                            <circle cx="6" cy="12" r="3"></circle>
                            <circle cx="18" cy="19" r="3"></circle>
                            <path d="m8.7 10.7 6.6-4.4"></path>
                            <path d="m8.7 13.3 6.6 4.4"></path>
                        </svg>
                    </span>

                    Compartilhar
                </button>
            </div>

            <p
                id="mensagem-compartilhar"
                class="noticia-mensagem-compartilhar"
                aria-live="polite"
            ></p>

        </section>

    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Componentes do projeto -->
    <script src="../js/components.js"></script>

    <!-- JavaScript geral do projeto -->
    <script src="../js/script.js"></script>

    <!-- JavaScript da página de notícias -->
    <script src="../js/noticia.js"></script>

</body>
</html>
